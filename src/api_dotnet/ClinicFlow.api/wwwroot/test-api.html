<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow API Tester</title>
    <style>
        body {
            font-family: monospace;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover { background: #764ba2; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>ClinicFlow API Tester</h1>
    
    <div class="test-section">
        <h2>1. Health Check</h2>
        <button onclick="testHealth()">Test /health</button>
        <pre id="health-result"></pre>
    </div>
    
    <div class="test-section">
        <h2>2. ML Service Health</h2>
        <button onclick="testMLHealth()">Test ML Service /health</button>
        <pre id="ml-health-result"></pre>
    </div>
    
    <div class="test-section">
        <h2>3. Analyze Schedule</h2>
        <button onclick="testAnalyze()">Test /schedule/analyze</button>
        <pre id="analyze-result"></pre>
    </div>
    
    <script>
        const API_BASE = window.location.origin;
        const ML_BASE = 'http://localhost:8000';
        
        async function testHealth() {
            const resultEl = document.getElementById('health-result');
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                resultEl.innerHTML = `<span class="success">✅ Success (${response.status})</span>\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ Error</span>\n${error.message}`;
            }
        }
        
        async function testMLHealth() {
            const resultEl = document.getElementById('ml-health-result');
            try {
                const response = await fetch(`${ML_BASE}/health`);
                const data = await response.json();
                resultEl.innerHTML = `<span class="success">✅ Success (${response.status})</span>\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ Error: ${error.message}\n\nMake sure ML service is running on port 8000</span>`;
            }
        }
        
        async function testAnalyze() {
            const resultEl = document.getElementById('analyze-result');
            const testRequest = {
                clinicProfile: {
                    clinicType: "PrimaryCare",
                    providersPerBlock: 3,
                    avgServiceMinutes: 15,
                    timeBlockMinutes: 240
                },
                appointments: [
                    {
                        appointmentId: 1,
                        appointmentType: "FollowUp",
                        dayOfWeek: "Tuesday",
                        timeBlock: "Morning",
                        leadTimeDays: 14,
                        isNewPatient: false,
                        historicalNoShowRate: 0.18,
                        unitRevenue: 120.0
                    },
                    {
                        appointmentId: 2,
                        appointmentType: "NewPatient",
                        dayOfWeek: "Tuesday",
                        timeBlock: "Morning",
                        leadTimeDays: 7,
                        isNewPatient: true,
                        historicalNoShowRate: 0.25,
                        unitRevenue: 150.0
                    }
                ]
            };
            
            try {
                const response = await fetch(`${API_BASE}/schedule/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testRequest)
                });
                
                if (!response.ok) {
                    const error = await response.text();
                    resultEl.innerHTML = `<span class="error">❌ Error (${response.status})</span>\n${error}`;
                    return;
                }
                
                const data = await response.json();
                resultEl.innerHTML = `<span class="success">✅ Success (${response.status})</span>\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ Error</span>\n${error.message}`;
            }
        }
    </script>
</body>
</html>
